name: CI

on:
  push:
    branches: [main, architecture-refactor, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: ./flypig

      - name: 安装前端依赖
        run: npm ci
        working-directory: ./flypig/interface/web/static_vite

      - name: Ruff Python 检查
        run: ruff check --output-format github
        working-directory: ./flypig

      - name: mypy 静态类型检查
        run: mypy --config-file=pyproject.toml flypig/domain flypig/application flypig/acl flypig/shared
        working-directory: ./flypig

      - name: ESLint 前端检查
        run: npx eslint src/
        working-directory: ./flypig/interface/web/static_vite

      - name: 架构合规检查（DDD / 接口契约 / 测试覆盖）
        run: python scripts/architecture_check.py

      - name: 前端合规检查（API 规范 / 数据分离）
        run: python scripts/frontend_check.py

      - name: 层依赖检查（import-linter）
        run: lint-imports
        working-directory: ./flypig

      - name: Vitest 前端测试
        run: npx vitest run --reporter=verbose
        working-directory: ./flypig/interface/web/static_vite

      - name: 后端单元测试 + 覆盖率
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=flypig --cov-report=term-missing
        working-directory: ./flypig/../
