repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--config, flypig/pyproject.toml, --fix]
      - id: ruff-format
        args: [--config, flypig/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.12.0
    hooks:
      - id: eslint
        args: [--config, flypig/interface/web/static_vite/.eslintrc.json, --fix]
        additional_dependencies:
          - eslint@9.12.0
          - eslint-plugin-vue@9.29.0

  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (层依赖检查)
        entry: lint-imports --config flypig/pyproject.toml
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-check
        name: architecture_check (DDD 合规)
        entry: python scripts/architecture_check.py
        language: system
        pass_filenames: false
        always_run: true
