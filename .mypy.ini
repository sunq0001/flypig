[mypy]
python_version = 3.11
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
explicit_package_bases = true
namespace_packages = true
follow_imports = silent
no_silence_site_packages = true
no_site_packages = true
cache_dir = %TEMP%\.mypy_cache
exclude = aider/|deepseek-tui/|docs/|typings/|flypig-archive/|flypig_archive2/|flypig/interface/web/static_vite/dist/|flypig/interface/web/static_vite/node_modules/|scripts/|tests/|node_modules/

[mypy-flypig.tests.*]
ignore_errors = true

[mypy-flypig-archive.*]
ignore_errors = true

[mypy-flypig_archive2.*]
ignore_errors = true
