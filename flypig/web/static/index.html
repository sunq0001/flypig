<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FlyPig Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/json/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e1e2e;
  --bg2:#252536;
  --bg3:#2d2d44;
  --fg:#cdd6f4;
  --fg2:#a6adc8;
  --fg3:#6c7086;
  --accent:#89b4fa;
  --accent2:#b4befe;
  --green:#a6e3a1;
  --yellow:#f9e2af;
  --red:#f38ba8;
  --border:#313244;
  --sidebar-w:260px;
  --chat-w:360px;
  --status-h:28px;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Microsoft YaHei','微软雅黑','PingFang SC','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* 三栏主区域 */
#layout{display:flex;flex:1;overflow:hidden}

/* 左侧面板 */
#sidebar{width:var(--sidebar-w);min-width:180px;display:flex;flex-direction:column;background:var(--bg2)}
.sidebar-header{padding:10px 12px;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sidebar-header .icon{font-size:14px}
#file-tree{flex:1;overflow-y:auto;padding:4px 0}
#file-tree::-webkit-scrollbar{width:5px}
#file-tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* 文件树样式 */
.tree-node{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node:hover{background:var(--bg3)}
.tree-node.selected{background:rgba(137,180,250,.15);color:var(--accent)}
.tree-node .indent{display:inline-block}
.tree-node .toggle{display:inline-block;width:16px;text-align:center;color:var(--fg3);font-size:11px;user-select:none}
.tree-node .toggle.expanded{color:var(--accent)}
.tree-node .name{display:inline-block;padding:3px 4px 3px 2px;font-size:13px;border-radius:3px}
.tree-node .name.dir{font-weight:500}
.tree-node .name.file{color:var(--fg2)}
.tree-node:hover .name{color:var(--fg)}
.tree-children{overflow:hidden}

/* 中间面板 */
#center{flex:1;min-width:200px;display:flex;flex-direction:column;overflow:hidden}
#empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:14px;flex-direction:column;gap:8px}
#empty-state .big-icon{font-size:48px;opacity:.3}

/* 编辑器区域 (上半) */
#editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:80px}

/* 垂直拖拽分割条 */
.v-divider{height:3px;cursor:row-resize;flex-shrink:0;position:relative;z-index:10;transition:background .08s}
.v-divider:hover,.v-divider.active{background:var(--accent)}
.v-divider::after{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px}

/* 终端区域 (下半) */
#terminal-area{height:200px;min-height:60px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#terminal-area .term-header{display:flex;align-items:center;padding:2px 10px;height:28px;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;font-size:11px;color:var(--fg3)}
#terminal-area .term-header .term-title{flex:1;font-weight:500}
#terminal-area .term-header .term-btn{background:none;border:none;color:var(--fg3);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:11px}
#terminal-area .term-header .term-btn:hover{color:var(--fg);background:var(--bg3)}
#terminal-xterm{flex:1;overflow:hidden;padding:2px}
#terminal-xterm .xterm{height:100%;padding:4px}
#terminal-xterm .xterm-viewport{scrollbar-width:thin}
#terminal-xterm .xterm-viewport::-webkit-scrollbar{width:5px}
#terminal-xterm .xterm-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* 文件标签页 */
#file-tabs{display:flex;height:35px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
#file-tabs::-webkit-scrollbar{height:2px}
#file-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.file-tab{display:flex;align-items:center;gap:4px;padding:0 10px;font-size:12px;color:var(--fg3);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;min-width:0}
.file-tab:hover{color:var(--fg);background:var(--bg3)}
.file-tab.active{color:var(--fg);background:var(--bg);border-bottom:2px solid var(--accent)}
.file-tab .name{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.file-tab .close{font-size:10px;padding:0 2px;border-radius:3px;opacity:0;transition:opacity .1s}
.file-tab:hover .close,.file-tab.active .close{opacity:.6}
.file-tab .close:hover{opacity:1;background:var(--border);color:var(--red)}

/* CodeMirror 编辑器区域 */
#editor-container{flex:1;overflow:hidden}
#editor-container .CodeMirror{height:100%;font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace;font-size:13px;line-height:1.6}
#editor-container .CodeMirror-gutters{background:var(--bg2);border-right:1px solid var(--border)}
#editor-container .CodeMirror-linenumber{color:var(--fg3);padding:0 8px}

/* 右侧面板 */
#chat{width:var(--chat-w);min-width:280px;display:flex;flex-direction:column;background:var(--bg2)}
.chat-header{padding:10px 12px;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;justify-content:space-between}
.chat-header .toolbar{display:flex;gap:4px}
.chat-header .tool-btn{background:none;border:none;color:var(--fg3);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:12px}
.chat-header .tool-btn:hover{color:var(--fg);background:var(--bg3)}
#messages{flex:1;overflow-y:auto;padding:8px}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{margin-bottom:8px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.msg-user{text-align:right}
.msg-user .bubble{display:inline-block;background:rgba(137,180,250,.2);color:var(--accent);padding:6px 12px;border-radius:12px 12px 4px 12px;max-width:85%;font-size:13px;line-height:1.5}
.msg-agent .bubble{display:inline-block;background:var(--bg3);color:var(--fg);padding:6px 12px;border-radius:12px 12px 12px 4px;max-width:100%;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg-thinking .bubble{background:transparent;color:var(--fg3);font-style:italic;font-size:12px;padding:4px 8px}
.msg-tool .bubble{background:rgba(166,227,161,.08);color:var(--green);padding:6px 12px;border-radius:8px;font-size:12px;font-family:monospace;line-height:1.4;white-space:pre-wrap;word-break:break-all}
.msg-tool-end .bubble{background:rgba(108,112,134,.1);color:var(--fg2);padding:6px 12px;border-radius:8px;font-size:12px;font-family:monospace;line-height:1.4;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.msg-error .bubble{background:rgba(243,139,168,.1);color:var(--red);padding:6px 12px;border-radius:8px;font-size:12px}
.msg-info .bubble{background:transparent;color:var(--fg3);padding:4px 8px;font-size:11px;text-align:center}
.msg-chain .bubble{background:rgba(180,190,254,.08);color:var(--accent2);padding:4px 10px;border-radius:6px;font-size:11px;text-align:center}
.msg-summary .bubble{background:rgba(166,227,161,.06);color:var(--green);padding:6px 12px;border-radius:8px;font-size:11px;font-family:monospace}

/* 输入区域 */
#input-area{padding:8px 10px 10px;border-top:1px solid var(--border)}
#input-row{display:flex;gap:6px;align-items:flex-end}
#chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg);font-size:13px;font-family:inherit;outline:none;resize:none;min-height:36px;max-height:120px;line-height:1.4}
#chat-input:focus{border-color:var(--accent)}
#chat-input::placeholder{color:var(--fg3)}
#send-btn{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;height:36px;display:flex;align-items:center;gap:4px}
#send-btn:hover{opacity:.85}
#send-btn:disabled{opacity:.3;cursor:not-allowed}

/* 状态栏 */
#status-bar{height:var(--status-h);background:var(--bg3);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--fg3);gap:16px}
#status-bar .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#status-bar .status-dot.offline{background:var(--red)}
#status-bar .status-dot.online{background:var(--green)}
#status-bar .status-dot.running{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#status-bar .status-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 初始化向导 overlay */
#setup-overlay{position:fixed;inset:0;background:rgba(30,30,46,.92);z-index:100;display:flex;align-items:center;justify-content:center}
#setup-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 40px;min-width:420px;max-width:480px}
#setup-box h2{font-size:20px;font-weight:600;margin-bottom:4px}
#setup-box p.sub{color:var(--fg3);font-size:13px;margin-bottom:20px}
.setup-step{display:none}
.setup-step.active{display:block}
.setup-step label{display:block;margin-bottom:4px;font-size:12px;color:var(--fg2);font-weight:500}
.setup-step input,.setup-step select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--fg);outline:none;margin-bottom:16px}
.setup-step input:focus,.setup-step select:focus{border-color:var(--accent)}
.setup-step select{cursor:pointer}
.setup-step select option{background:var(--bg2)}
.setup-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.setup-actions button{padding:8px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.setup-actions .btn-primary{background:var(--accent);color:var(--bg)}
.setup-actions .btn-primary:hover{opacity:.85}
.setup-actions .btn-secondary{background:var(--bg3);color:var(--fg2)}
.setup-actions .btn-secondary:hover{background:var(--border);color:var(--fg)}
.setup-actions .btn-secondary:disabled{opacity:.3;cursor:not-allowed}
.setup-error{color:var(--red);font-size:12px;margin-top:-8px;margin-bottom:12px}

/* Markdown 内容样式（在气泡内） */
.bubble h1,.bubble h2,.bubble h3,.bubble h4{font-size:inherit;font-weight:600;margin:8px 0 4px}
.bubble p{margin:4px 0}
.bubble ul,.bubble ol{padding-left:20px;margin:4px 0}
.bubble li{margin:2px 0}
.bubble code{padding:1px 5px;border-radius:4px;font-size:12px;background:rgba(108,112,134,.2);font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
.bubble pre{margin:8px 0;border-radius:6px;overflow-x:auto}
.bubble pre code{display:block;padding:10px 14px;background:var(--bg) !important;border:1px solid var(--border);border-radius:6px;font-size:12px;line-height:1.5}
.bubble strong{font-weight:600}
.bubble a{color:var(--accent);text-decoration:none}
.bubble a:hover{text-decoration:underline}
.bubble blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:6px 0;color:var(--fg3)}
.bubble hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.bubble table{border-collapse:collapse;margin:6px 0;font-size:12px}
.bubble th,.bubble td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.bubble th{background:var(--bg3);font-weight:600}

/* 加载动画 */
.loading-dots::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}

/* 拖拽分割条 — VS Code 风格：2px 细条，hover 时亮起 */
.divider{width:2px;cursor:col-resize;flex-shrink:0;position:relative;z-index:10;transition:background .08s}
.divider:hover,.divider.active{background:var(--accent)}
/* 增大热区方便点击（视觉上还是 2px） */
.divider::after{content:'';position:absolute;left:-4px;right:-4px;top:0;bottom:0}

/* 通用 */
.ml-auto{margin-left:auto}
.flex{display:flex}
.gap-4{gap:4px}
.text-sm{font-size:12px}
.text-muted{color:var(--fg3)}
</style>
</head>
<body>
<div id="app">
  <!-- 初始化向导 -->
  <div id="setup-overlay" v-if="showSetup">
    <div id="setup-box">
      <h2>🚀 FlyPig Agent</h2>
      <p class="sub">你的 AI 编码助手</p>

      <!-- Step 1: 工作区 -->
      <div class="setup-step" :class="{active: setupStep===1}">
        <label>📂 工作区目录</label>
        <input v-model="setupWorkspace" placeholder="输入工作区路径..." @keyup.enter="setupNext">
        <div style="margin-top:-12px;margin-bottom:16px">
          <button @click="browseWorkspace" style="background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:4px 0">📁 浏览...</button>
        </div>
        <div class="setup-actions">
          <button class="btn-primary" @click="setupNext">下一步 →</button>
        </div>
      </div>

      <!-- Step 2: 模型 -->
      <div class="setup-step" :class="{active: setupStep===2}">
        <label>🤖 AI 模型</label>
        <select v-model="setupModel" style="margin-bottom:8px">
          <option v-for="m in models" :key="m.name" :value="m.name" :disabled="!m.has_key && m.provider !== 'DeepSeek'">
            {{ m.name }} ({{ m.provider }}) {{ m.has_key ? '✓' : '' }}
          </option>
        </select>
        <div class="setup-actions">
          <button class="btn-secondary" @click="setupStep=1">← 上一步</button>
          <button class="btn-primary" @click="setupNext">下一步 →</button>
        </div>
      </div>

      <!-- Step 3: API Key -->
      <div class="setup-step" :class="{active: setupStep===3}">
        <label>🔑 API Key</label>
        <div style="font-size:12px;color:var(--fg3);margin-bottom:8px">提供商: {{ selectedProvider }}</div>
        <input v-model="setupApiKey" type="password" placeholder="输入 API Key（留空使用已有配置）" @keyup.enter="setupFinish">
        <div class="setup-error" v-if="setupError">{{ setupError }}</div>
        <div class="setup-actions">
          <button class="btn-secondary" @click="setupStep=2">← 上一步</button>
          <button class="btn-primary" @click="setupFinish">开始使用 →</button>
        </div>
      </div>

      <!-- 加载中 -->
      <div v-if="setupLoading" style="text-align:center;padding:20px">
        <div style="font-size:14px;color:var(--fg2)">初始化中<span class="loading-dots"></span></div>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="layout" v-show="!showSetup" ref="layoutRef">
    <!-- 左侧：文件树 -->
    <div id="sidebar" :style="{width: leftWidth + 'px'}">
      <div class="sidebar-header"><span class="icon">📁</span> 文件</div>
      <div id="file-tree">
        <template v-if="fileTree && fileTree.children">
          <tree-node
            v-for="node in fileTree.children"
            :key="node.path"
            :node="node"
            :depth="0"
            :selected-path="activeTabIndex >= 0 ? openTabs[activeTabIndex].path : ''"
            @select="openFile"
          />
        </template>
        <div v-else style="padding:16px;color:var(--fg3);font-size:12px;text-align:center">暂无文件</div>
      </div>
    </div>

    <div class="divider" :class="{active: resizing === 'left'}"
         @mousedown.prevent="startResize($event, 'left')"></div>

    <!-- 中间：代码编辑器 + 标签页 + 终端 -->
    <div id="center">
      <div id="editor-area">
        <div id="file-tabs" v-if="openTabs.length > 0">
          <div v-for="(tab, i) in openTabs" :key="tab.path"
               class="file-tab" :class="{active: i === activeTabIndex}"
               @click="switchTab(i)" @mouseup.middle="closeTab(i)">
            <span class="name">{{ tab.name }}</span>
            <span class="close" @click.stop="closeTab(i)">×</span>
          </div>
        </div>
        <div id="editor-container" ref="editorContainer" v-show="openTabs.length > 0"></div>
        <div id="empty-state" v-show="openTabs.length === 0">
          <div class="big-icon">📄</div>
          <div>点击左侧文件查看内容</div>
          <div style="font-size:12px;color:var(--fg3)">或发送消息让 AI 工作</div>
        </div>
      </div>

      <div class="v-divider" :class="{active: vResizing}"
           @mousedown.prevent="startVResize($event)"></div>

      <div id="terminal-area" :style="{height: termHeight + 'px'}">
        <div class="term-header">
          <span class="term-title">⬢ 终端</span>
          <button class="term-btn" @click="resetTerminal" title="重启终端">↺</button>
          <button class="term-btn" @click="toggleTerminal" title="折叠终端">{{ termCollapsed ? '⬆' : '⬇' }}</button>
        </div>
        <div id="terminal-xterm" ref="terminalXterm" v-show="!termCollapsed"></div>
      </div>
    </div>

    <div class="divider" :class="{active: resizing === 'right'}"
         @mousedown.prevent="startResize($event, 'right')"></div>

    <!-- 右侧：对话 -->
    <div id="chat" :style="{width: rightWidth + 'px'}">
      <div class="chat-header">
        <span>💬 对话</span>
        <div class="toolbar">
          <button class="tool-btn" @click="resetChat" title="重置对话">↺</button>
          <button class="tool-btn" @click="showCost" title="查看费用">💰</button>
        </div>
      </div>
      <div id="messages" ref="messagesRef">
        <div v-for="(m, i) in messages" :key="i" :class="'msg msg-' + m.type">
          <div class="bubble" v-if="m.type==='agent'||m.type==='summary'" v-html="renderMarkdown(m.content)"></div>
          <div class="bubble" v-else>{{ m.content }}</div>
        </div>
      </div>
      <div id="input-area">
        <div id="input-row">
          <textarea
            id="chat-input"
            v-model="userInput"
            @keydown="handleKeydown"
            placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
            :disabled="agentRunning"
            rows="1"
          ></textarea>
          <button id="send-btn" @click="sendMessage" :disabled="agentRunning || !userInput.trim()">
            ▶
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="status-bar" v-show="!showSetup">
    <span class="status-dot" :class="statusClass"></span>
    <span class="status-text">{{ statusText }}</span>
    <span v-if="costStr" class="text-sm text-muted">{{ costStr }}</span>
  </div>
</div>

<script>
const { createApp, ref, computed, watch, nextTick, onMounted } = Vue;

// ── 文件树组件（递归） ──
app = createApp({
  setup() {
    // ── 状态 ──
    const showSetup = ref(true);
    const setupStep = ref(1);
    const setupWorkspace = ref('');
    const setupModel = ref('');
    const setupApiKey = ref('');
    const setupError = ref('');
    const setupLoading = ref(false);
    const models = ref([]);
    const selectedProvider = ref('');

    const fileTree = ref(null);
    const openTabs = ref([]);       // [{path, name, content}]
    const activeTabIndex = ref(-1);
    const messages = ref([]);
    const userInput = ref('');
    const agentRunning = ref(false);
    const statusText = ref('未连接');
    const statusClass = ref('offline');
    const costStr = ref('');
    const messagesRef = ref(null);
    const layoutRef = ref(null);
    const editorContainer = ref(null);
    let _editor = null;             // CodeMirror 实例

    // ── 终端状态（原生 WebSocket） ──
    const terminalXterm = ref(null);
    const termHeight = ref(200);
    const termCollapsed = ref(false);
    const vResizing = ref(false);
    let _ptyWs = null;          // PTY WebSocket 连接
    let _xterm = null;
    let _xtermFit = null;
    let _wsPort = 8322;         // PTY WebSocket 端口（从 /api/config 更新）
    let _vResizeStartY = 0;
    let _vResizeStartH = 200;

    // ── 面板拖拽 ──
    const leftWidth = ref(260);
    const rightWidth = ref(360);
    const resizing = ref(null);
    let _resizeStartX = 0;
    let _resizeStartLeft = 260;
    let _resizeStartRight = 360;

    function startResize(e, side) {
      resizing.value = side;
      _resizeStartX = e.clientX;
      _resizeStartLeft = leftWidth.value;
      _resizeStartRight = rightWidth.value;
      document.addEventListener('mousemove', onResize);
      document.addEventListener('mouseup', stopResize);
    }

    function onResize(e) {
      if (!resizing.value) return;
      const dx = e.clientX - _resizeStartX;
      if (resizing.value === 'left') {
        const w = Math.max(180, Math.min(500, _resizeStartLeft + dx));
        leftWidth.value = w;
      } else {
        const w = Math.max(280, Math.min(600, _resizeStartRight - dx));
        rightWidth.value = w;
      }
    }

    function stopResize() {
      resizing.value = null;
      document.removeEventListener('mousemove', onResize);
      document.removeEventListener('mouseup', stopResize);
    }

    // ── 垂直拖拽（编辑器/终端分割） ──
    function startVResize(e) {
      vResizing.value = true;
      _vResizeStartY = e.clientY;
      _vResizeStartH = termHeight.value;
      document.addEventListener('mousemove', onVResize);
      document.addEventListener('mouseup', stopVResize);
    }
    function onVResize(e) {
      if (!vResizing.value) return;
      const dy = _vResizeStartY - e.clientY;
      const h = Math.max(60, Math.min(600, _vResizeStartH + dy));
      termHeight.value = h;
    }
    function stopVResize() {
      vResizing.value = null;
      document.removeEventListener('mousemove', onVResize);
      document.removeEventListener('mouseup', stopVResize);
    }

    // ── CodeMirror mode 映射 ──
    function getMode(ext) {
      const map = {py:'python',js:'javascript',ts:'javascript',jsx:'javascript',tsx:'javascript',
                   go:'go',rs:'rust',md:'markdown',json:'json',yaml:'yaml',yml:'yaml',
                   html:'htmlmixed',css:'css',vue:'htmlmixed',sh:'shell',bat:'powershell',
                   ps1:'powershell',toml:'yaml',xml:'xml',sql:'sql'};
      return map[ext] || 'text/plain';
    }

    function _initEditor(content, mode) {
      const container = editorContainer.value;
      if (!container) return;
      if (_editor) _editor.toTextArea();
      const ta = document.createElement('textarea');
      ta.value = content || '';
      container.innerHTML = '';
      container.appendChild(ta);
      _editor = CodeMirror.fromTextArea(ta, {
        mode: mode,
        theme: 'material-darker',
        lineNumbers: true,
        readOnly: true,
        lineWrapping: false,
        tabSize: 2,
        indentUnit: 2,
        viewportMargin: Infinity,
      });
      _editor.setSize('100%', '100%');
    }

    // ── 初始化 ──
    onMounted(async () => {
      await loadConfig();
    });

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data.status === 'not_initialized') return;
        setupWorkspace.value = data.workspace || '';
        models.value = data.models || [];
        setupModel.value = data.default_model || '';
        if (data.ws_port) _wsPort = data.ws_port;
        if (data.workspace) {
          showSetup.value = false;
          await initAgent(data.workspace, data.default_model, '');
        }
      } catch (e) {
        console.error('load config error:', e);
      }
    }

    // ── SSE 连接 ──
    let eventSource = null;

    function connectSSE() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/events');
      statusClass.value = 'online';
      statusText.value = '已连接';

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleEvent(data);
        } catch (e) {}
      };

      eventSource.onerror = () => {
        statusClass.value = 'offline';
        statusText.value = '连接断开，正在重连...';
        setTimeout(connectSSE, 2000);
      };
    }

    function handleEvent(data) {
      switch (data.type) {
        case 'thinking':
          messages.value.push({type:'thinking', content:'🧠 '+data.content});
          break;
        case 'tool_start': {
          const name = data.name;
          const args = data.arguments || {};
          let desc = '';
          if (name === 'bash') desc = '💻 '+ (args.command || '').slice(0,100);
          else if (name === 'read_file') desc = '📖 '+ (args.path || '');
          else if (name === 'write_file') desc = '✏️ 写入 '+ (args.path || '');
          else if (name === 'edit_file') desc = '🔧 编辑 '+ (args.path || '');
          else if (name === 'find_files') desc = '🔍 '+ (args.pattern || '');
          else if (name === 'grep') desc = '🔎 '+ (args.pattern || '');
          else desc = `🔧 ${name}`;
          messages.value.push({type:'tool', content: desc});
          break;
        }
        case 'tool_end': {
          const result = (data.result || '').slice(0,300);
          if (result.trim()) {
            messages.value.push({type:'tool-end', content: result});
          }
          break;
        }
        case 'tool_chain_end':
          statusText.value = `工具链: ${data.tool_count} 个工具 | ${data.tokens?.toLocaleString()} tokens`;
          break;
        case 'llm_end':
          costStr.value = formatCost(data.session_cost, data.session_tokens);
          break;
        case 'response':
          messages.value.push({type:'agent', content: data.content || '[无回复]'});
          statusText.value = '就绪';
          agentRunning.value = false;
          break;
        case 'summary':
          messages.value.push({type:'summary', content: data.content});
          break;
        case 'error':
          messages.value.push({type:'error', content: '❌ ' + data.content});
          agentRunning.value = false;
          statusText.value = '出错了';
          break;
        case 'done':
          agentRunning.value = false;
          statusText.value = '就绪';
          break;
      }
      scrollMessages();
    }

    function scrollMessages() {
      nextTick(() => {
        const el = messagesRef.value;
        if (el) el.scrollTop = el.scrollHeight;
      });
    }

    // ── 文件树组件注册 ──
    app.component('tree-node', {
      props: {
        node: Object,
        depth: Number,
        selectedPath: String,
      },
      emits: ['select'],
      setup(props, { emit }) {
        const expanded = ref(!props.node.is_dir || props.depth < 1);
        const isSelected = computed(() => props.node.path === props.selectedPath);

        function toggle() {
          if (props.node.is_dir) {
            expanded.value = !expanded.value;
          } else {
            emit('select', props.node.path);
          }
        }

        return { expanded, isSelected, toggle };
      },
      template: `
        <div>
          <div class="tree-node" :class="{selected: isSelected}" @click="toggle" :style="{paddingLeft: (depth*16+4)+'px'}">
            <span class="toggle" v-if="node.is_dir" :class="{expanded: expanded}">
              {{ expanded ? '▼' : '▶' }}
            </span>
            <span class="toggle" v-else style="visibility:hidden">▶</span>
            <span class="name" :class="{dir: node.is_dir, file: !node.is_dir}">
              {{ node.is_dir ? '📁 ' : '📄 ' }}{{ node.name }}
            </span>
          </div>
          <div v-if="node.is_dir && expanded" class="tree-children">
            <template v-if="node.children && node.children.length">
              <tree-node
                v-for="child in node.children"
                :key="child.path"
                :node="child"
                :depth="depth + 1"
                :selected-path="selectedPath"
                @select="(p) => emit('select', p)"
              />
            </template>
            <div v-else style="padding:2px 0 2px 20px;color:var(--fg3);font-size:11px">（空）</div>
          </div>
        </div>
      `
    });

    // ── 方法 ──
    async function browseWorkspace() {
      try {
        const input = document.createElement('input');
        input.type = 'file';
        // 使用 nw-dialog 或简单的 path 输入
        // 在 webview 中可用 <input webkitdirectory>，但浏览器不行
        // 直接用文件浏览器预览窗口，使用 input
        const dirInput = document.createElement('input');
        dirInput.type = 'text';
        // 浏览器不支持文件夹选择器 API，回退到手动输入
        setupWorkspace.value = prompt('输入工作区绝对路径:', setupWorkspace.value) || setupWorkspace.value;
      } catch(e) {}
    }

    async function setupNext() {
      setupError.value = '';
      if (setupStep.value === 1) {
        if (!setupWorkspace.value.trim()) {
          setupError.value = '请输入工作区路径';
          return;
        }
        // 验证工作区
        try {
          const res = await fetch('/api/config/workspace', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({path: setupWorkspace.value}),
          });
          const data = await res.json();
          if (data.error) { setupError.value = data.error; return; }
          setupWorkspace.value = data.workspace;
        } catch(e) {
          setupError.value = '连接服务器失败';
          return;
        }
        // 加载模型列表
        await loadModels();
        setupStep.value = 2;
      } else if (setupStep.value === 2) {
        if (!setupModel.value) {
          setupError.value = '请选择一个模型';
          return;
        }
        const model = models.value.find(m => m.name === setupModel.value);
        if (model) selectedProvider.value = model.provider;
        if (model && model.has_key) {
          // Key 已配置，直接完成
          await setupFinish();
        } else {
          setupStep.value = 3;
        }
      }
    }

    async function loadModels() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        models.value = data.models || [];
        if (!setupModel.value && models.value.length > 0) {
          setupModel.value = models.value[0].name;
        }
      } catch(e) {
        console.error('load models error:', e);
      }
    }

    async function setupFinish() {
      setupError.value = '';
      setupLoading.value = true;
      try {
        // 保存 API Key（如果有）
        if (setupApiKey.value && selectedProvider.value) {
          await fetch('/api/config/apikey', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({provider: selectedProvider.value, api_key: setupApiKey.value}),
          });
        }
        // 初始化 Agent
        const ok = await initAgent(setupWorkspace.value, setupModel.value, setupApiKey.value);
        if (ok) {
          showSetup.value = false;
        } else {
          setupError.value = '初始化失败，请检查配置';
        }
      } catch(e) {
        setupError.value = '初始化失败: ' + e.message;
      } finally {
        setupLoading.value = false;
      }
    }

    async function initAgent(workspace, model, apiKey) {
      try {
        const res = await fetch('/api/init', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({workspace, model, api_key: apiKey}),
        });
        const data = await res.json();
        if (data.error) return false;
        // 加载文件树
        await loadFileTree();
        // 连接 SSE
        connectSSE();
        // 启动终端
        setTimeout(() => initTerminal(), 500);
        statusText.value = '就绪';
        messages.value.push({type:'info', content:'🚀 FlyPig Agent 已就绪'});
        return true;
      } catch(e) {
        return false;
      }
    }

    async function loadFileTree() {
      try {
        const res = await fetch('/api/tree');
        fileTree.value = await res.json();
      } catch(e) {
        console.error('load tree error:', e);
      }
    }

    async function openFile(path) {
      // 检查是否已打开
      const existing = openTabs.value.findIndex(t => t.path === path);
      if (existing >= 0) {
        switchTab(existing);
        return;
      }
      try {
        const res = await fetch('/api/file?path=' + encodeURIComponent(path));
        const data = await res.json();
        const name = path.split('/').pop() || path;
        openTabs.value.push({
          path: data.path || path,
          name: name,
          content: data.content || '// Error: ' + (data.error || ''),
        });
        switchTab(openTabs.value.length - 1);
      } catch(e) {
        openTabs.value.push({path, name: path.split('/').pop(), content: '// Error: ' + e.message});
        switchTab(openTabs.value.length - 1);
      }
    }

    function switchTab(index) {
      if (index < 0 || index >= openTabs.value.length) return;
      activeTabIndex.value = index;
      const tab = openTabs.value[index];
      const ext = tab.name.split('.').pop();
      _initEditor(tab.content, getMode(ext));
    }

    // ── 终端（原生 WebSocket ↔ PTY） ──
    function initTerminal() {
      const container = terminalXterm.value;
      if (!container || _xterm) return;

      _xterm = new Terminal({
        cursorBlink: true,
        cursorStyle: 'bar',
        fontSize: 13,
        fontFamily: "'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace",
        theme: {
          background: '#1e1e2e', foreground: '#cdd6f4',
          cursor: '#89b4fa', selectionBackground: '#45475a',
          black: '#45475a', red: '#f38ba8', green: '#a6e3a1',
          yellow: '#f9e2af', blue: '#89b4fa', magenta: '#f5c2e7',
          cyan: '#94e2d5', white: '#bac2de',
          brightBlack: '#585b70', brightRed: '#f38ba8',
          brightGreen: '#a6e3a1', brightYellow: '#f9e2af',
          brightBlue: '#89b4fa', brightMagenta: '#f5c2e7',
          brightCyan: '#94e2d5', brightWhite: '#a6adc8',
        },
        allowProposedApi: true,
      });
      _xtermFit = new FitAddon.FitAddon();
      _xterm.loadAddon(_xtermFit);
      _xterm.open(container);
      _xtermFit.fit();

      // 连接原生 WebSocket → PTY
      _connectPtyWs();

      // 键盘输入 → WebSocket 发送原始字节
      _xterm.onData((data) => {
        if (_ptyWs && _ptyWs.readyState === WebSocket.OPEN) {
          _ptyWs.send(data);
        }
      });

      // resize → 文本帧 JSON
      _xterm.onResize(({ cols, rows }) => {
        if (_ptyWs && _ptyWs.readyState === WebSocket.OPEN) {
          _ptyWs.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      // 窗口大小变化时自适应
      window.addEventListener('resize', () => {
        if (_xtermFit) setTimeout(() => _xtermFit.fit(), 50);
      });
    }

    function _connectPtyWs() {
      const termId = 'term_' + Date.now();
      const hostname = location.hostname;
      const url = `ws://${hostname}:${_wsPort}/pty/${termId}`;
      console.log('[PTY WS] connecting to', url);

      _ptyWs = new WebSocket(url);
      _ptyWs.binaryType = 'arraybuffer';

      _ptyWs.onopen = () => {
        console.log('[PTY WS] connected');
        if (_xterm) {
          _xterm.write('\r\n\x1b[32m[终端已连接]\x1b[0m\r\n');
          _xterm.focus();
        }
      };

      _ptyWs.onmessage = (e) => {
        if (_xterm) {
          if (e.data instanceof ArrayBuffer) {
            _xterm.write(new Uint8Array(e.data));
          } else if (typeof e.data === 'string') {
            _xterm.write(e.data);
          }
        }
      };

      _ptyWs.onclose = () => {
        console.log('[PTY WS] disconnected');
        if (_xterm) {
          _xterm.write('\r\n\x1b[31m[连接断开，2秒后重连]\x1b[0m\r\n');
        }
        _ptyWs = null;
        // 自动重连
        setTimeout(() => {
          if (_xterm && !_ptyWs) _connectPtyWs();
        }, 2000);
      };

      _ptyWs.onerror = (err) => {
        console.error('[PTY WS] error:', err);
      };
    }

    function resetTerminal() {
      if (_ptyWs) { _ptyWs.close(); _ptyWs = null; }
      if (_xterm) { _xterm.dispose(); _xterm = null; }
      setTimeout(() => initTerminal(), 100);
    }

    function toggleTerminal() {
      termCollapsed.value = !termCollapsed.value;
      if (!termCollapsed.value && _xtermFit) {
        setTimeout(() => _xtermFit.fit(), 100);
      }
    }

    function closeTab(index) {
      if (index < 0 || index >= openTabs.value.length) return;
      openTabs.value.splice(index, 1);
      if (openTabs.value.length === 0) {
        activeTabIndex.value = -1;
        if (_editor) { _editor.toTextArea(); _editor = null; }
      } else if (index <= activeTabIndex.value) {
        switchTab(Math.max(0, activeTabIndex.value - 1));
      }
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || agentRunning.value) return;
      userInput.value = '';
      messages.value.push({type:'user', content: text});
      scrollMessages();
      agentRunning.value = true;
      statusText.value = 'AI 思考中...';
      statusClass.value = 'running';
      try {
        await fetch('/api/run', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message: text}),
        });
      } catch(e) {
        messages.value.push({type:'error', content: '❌ ' + e.message});
        agentRunning.value = false;
        statusText.value = '出错了';
      }
    }

    function renderMarkdown(text) {
      if (!text) return '';
      try {
        return marked.parse(text, {breaks: true});
      } catch(e) {
        return text;
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function formatCost(cost, tokens) {
      if (cost == null) return '';
      let costStr;
      if (cost >= 0.01) {
        costStr = '$' + cost.toFixed(4);
      } else if (cost >= 0.0001) {
        costStr = '$' + cost.toFixed(6);
      } else if (cost > 0) {
        costStr = cost.toExponential(2).replace('e', '×10^');
      } else {
        costStr = '$0.00';
      }
      return `💵 ${costStr} | ${(tokens || 0).toLocaleString()} tokens`;
    }

    async function resetChat() {
      if (agentRunning.value) return;
      await fetch('/api/agent/command', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({command: 'reset'}),
      });
      messages.value = [];
      messages.value.push({type:'info', content:'对话已重置'});
      costStr.value = '';
    }

    async function showCost() {
      if (agentRunning.value) return;
      const res = await fetch('/api/agent/command', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({command: 'cost'}),
      });
      const data = await res.json();
      if (data.ok) {
        messages.value.push({type:'info', content: data.response});
      }
    }

    watch(userInput, (val) => {
      const ta = document.getElementById('chat-input');
      if (ta) {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
      }
    });

    return {
      showSetup, setupStep, setupWorkspace, setupModel, setupApiKey,
      setupError, setupLoading, models, selectedProvider,
      fileTree, openTabs, activeTabIndex,
      messages, userInput, agentRunning, statusText, statusClass, costStr,
      messagesRef, layoutRef, editorContainer,
      leftWidth, rightWidth, resizing, vResizing, startResize, startVResize,
      terminalXterm, termHeight, termCollapsed,
      browseWorkspace, setupNext, setupFinish, openFile, switchTab, closeTab,
      sendMessage, handleKeydown, resetChat, showCost, renderMarkdown,
      initTerminal, resetTerminal, toggleTerminal,
    };
  }
});

app.mount('#app');
</script>
</body>
</html>
