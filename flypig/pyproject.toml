[project]
name = "flypig"
version = "0.1.0"
description = "A headless code agent with transparent cost tracking"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
]

[project.scripts]
flypig = "flypig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flypig"]
