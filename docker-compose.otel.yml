# Jaeger all-in-one — OpenTelemetry 追踪可视化
#
# 用法:
#   docker compose -f docker-compose.otel.yml up -d
#   然后打开 http://localhost:16686 查看全链路追踪
#
# 端口:
#   16686: Jaeger UI（追踪可视化界面）
#   4317:  OTLP gRPC 接收器
#   4318:  OTLP HTTP 接收器（FlyPig 默认使用此端口）
#
# 禁用:
#   设环境变量 FLYPIG_OTEL_ENABLED=0 即可关闭追踪，无需停止 Jaeger

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: flypig-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
